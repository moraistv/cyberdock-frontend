<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&amp;display=swap" rel="stylesheet">
    <title>CyberDock | Gestão de fulfillment</title>
    <script>
      /*
        Retorno da autorização da Shopee e do TikTok Shop.

        Os marketplaces redirecionam para o domínio do site, mas quem grava a
        loja é a API. Deixar esta etapa só com o aplicativo Vue falha em um caso
        importante: o marketplace conclui a autorização, mas um pacote antigo
        em cache, um chunk indisponível ou uma falha ao carregar o aplicativo
        impede o código de chegar ao backend. A loja fica autorizada fora e não
        aparece no CyberDock.

        Este trecho roda direto no HTML, antes de qualquer pacote. Ele preserva
        code/state e envia o retorno ao callback correspondente da API, que
        reconhece a tentativa, grava a conta e volta para /contas.

        `handoff=1` marca um retorno que a própria API já devolveu para o site e
        impede os dois lados de ficarem redirecionando o mesmo endereço.
      */
      (function () {
        try {
          var callbacks = {
            '/shopee/callback': '/shopee/callback',
            '/tiktok/callback': '/tiktok/callback'
          };
          var callback = callbacks[window.location.pathname];
          if (!callback) return;

          var query = window.location.search || '';
          if (!query || query.indexOf('handoff=1') !== -1) return;
          var api = window.location.hostname === 'localhost'
            ? 'http://localhost:3001/api'
            : 'https://api.cyberdock.com.br/api';
          window.location.replace(api + callback + query);
        } catch (error) {
          /* Qualquer imprevisto aqui deixa o aplicativo tentar do jeito antigo. */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
