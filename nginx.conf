# Configuração do nginx para o CyberDock (aplicação de página única).
#
# Este arquivo é copiado pelo Dockerfile (`COPY nginx.conf
# /etc/nginx/conf.d/default.conf`) e NÃO existia no repositório.
#
# O QUE ESTAVA ERRADO, e o efeito real em produção:
#
# O fallback de página única costuma ser escrito como `try_files $uri /index.html`
# para TODO caminho. Assim, um arquivo estático que não existe deixa de responder
# 404 e passa a responder o index.html com status 200 e Content-Type text/html.
# Conferido em produção: /js/nao-existe.js devolvia 200 com o HTML de 2384 bytes.
#
# Isso quebra a aplicação de um jeito silencioso. As telas são carregadas sob
# demanda e o nome do arquivo leva o hash do build; todo deploy troca os hashes.
# Um navegador com o index.html antigo em cache pede o chunk antigo, recebe HTML
# no lugar de JavaScript, o import() falha, a navegação inicial é abortada e o
# usuário termina no dashboard — perdendo a URL que colou na barra de endereço.
#
# As duas regras que resolvem: arquivo estático ausente responde 404 de verdade,
# e o index.html nunca é cacheado, para que um deploy seja visto na primeira
# visita e não quando o cache do navegador vencer.
#
# NOTA SOBRE add_header: um bloco `location` que declara qualquer `add_header`
# NÃO herda os `add_header` do bloco `server`. Por isso os cabeçalhos de
# segurança são repetidos em cada location em vez de declarados uma vez acima —
# declarar lá em cima os apagaria de todas as respostas.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão. `gzip_vary` é necessário porque há proxy na frente: sem ele,
    # uma resposta comprimida pode ser entregue a um cliente que não aceita gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------
    # Arquivos com hash no nome: 404 quando faltam, cache longo quando existem.
    #
    # O `=404` é o centro da correção. É ele que permite ao navegador, e ao
    # tratamento de erro em src/router/index.js, PERCEBER que o pacote pedido não
    # existe mais — em vez de receber HTML fingindo ser JavaScript.
    #
    # `immutable` é seguro justamente porque o nome carrega o hash do conteúdo:
    # se o conteúdo muda, o nome muda.
    # ---------------------------------------------------------------------
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|otf|png|jpe?g|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # O index.html NUNCA é cacheado.
    #
    # Ele é o índice dos pacotes com hash. Cacheado, o navegador continua pedindo
    # os arquivos do build anterior depois de um deploy — que é exatamente o
    # cenário do bug. Sem cache aqui, a primeira visita após o deploy já recebe
    # os nomes corretos.
    # ---------------------------------------------------------------------
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------------
    # Navegação: qualquer outro caminho é rota do Vue Router e recebe o
    # index.html. É isto que faz F5 e link colado funcionarem em
    # /admin/users/<uid>/cobranca.
    #
    # Só chega aqui o que NÃO casou com a regra de arquivo estático acima, então
    # o fallback deixou de alcançar .js e .css.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
